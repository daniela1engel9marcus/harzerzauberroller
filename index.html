<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151c2c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Harzerzauber"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>JGA – Harzerzauberroller Countdown</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=IM+Fell+English:ital@0;1&display=swap');
:root{color:#f8e7bd;font-family:Georgia,serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 32%,#384354 0%,#151c2c 53%,#080b14 100%);overflow-x:hidden}.scene{position:relative;isolation:isolate;min-height:100svh;max-width:700px;margin:auto;padding:50px 16px 85px;display:flex;align-items:center;flex-direction:column;text-align:center}.scene:before{content:"✦   ·    ✧      ✦       ·    ✧     ✦    ·   ✦";position:absolute;inset:5% 0 auto;font-size:30px;line-height:3.7;letter-spacing:18px;color:#e9c97a77;z-index:-1;word-break:break-all;text-shadow:0 0 20px #ffe7a5}.moon{position:absolute;top:8%;right:10%;width:100px;height:100px;border-radius:50%;background:#fff0b6;box-shadow:0 0 35px #e9c76e88,0 0 110px #e9c76e44;z-index:-1}.castle{position:absolute;bottom:0;width:100%;height:43%;z-index:-2;opacity:.9;background:#090d18;clip-path:polygon(0 100%,0 75%,7% 75%,7% 54%,10% 54%,10% 45%,13% 54%,13% 77%,19% 77%,19% 61%,22% 61%,22% 49%,25% 61%,25% 76%,32% 76%,32% 42%,35% 42%,35% 24%,38% 42%,38% 70%,43% 70%,43% 56%,47% 56%,47% 35%,50% 22%,53% 35%,53% 56%,57% 56%,57% 72%,63% 72%,63% 48%,66% 48%,66% 34%,69% 48%,69% 78%,76% 78%,76% 63%,80% 63%,80% 50%,84% 63%,84% 78%,90% 78%,90% 55%,93% 44%,96% 55%,96% 76%,100% 76%,100% 100%)}.eyebrow{font:700 .8rem 'Cinzel',Georgia,serif;letter-spacing:.28em;color:#e3c785;margin:18px 0}.crown{font-size:3.4rem;filter:drop-shadow(0 0 12px #edca6e)}h1{font:900 clamp(3.6rem,16vw,6.3rem) 'Cinzel',Georgia,serif;margin:0;line-height:1.1;color:#f7e5b2;text-shadow:0 0 22px #b18b3d99,0 5px 2px #080b12}.ribbon{font:700 clamp(1.35rem,5vw,2.3rem) 'Cinzel',Georgia,serif;color:#f5d991;border:1px solid #bc9958;border-radius:6px;padding:16px 13px;margin:22px 0 8px;background:linear-gradient(130deg,#4a242aee,#251b2bee);box-shadow:0 0 0 5px #0d1420,0 0 0 6px #9b7849,0 14px 45px #0009;max-width:100%;overflow-wrap:anywhere}.date{font:700 clamp(1.1rem,4.6vw,1.6rem) 'Cinzel',Georgia,serif;margin:25px 0 8px}.sub{font:italic 1.25rem 'IM Fell English',Georgia,serif;margin:0 0 26px;color:#e9d9b9}.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;max-width:570px}.unit{border:1px solid #c9a765;border-radius:5px;background:linear-gradient(150deg,#e8d6aa,#ad946b);color:#291c17;padding:15px 3px;box-shadow:inset 0 0 0 3px #4c352444,0 9px 25px #0009}.number{display:block;font:900 clamp(1.8rem,8vw,3.5rem) 'Cinzel',Georgia,serif;font-variant-numeric:tabular-nums}.unit small{font:700 clamp(.63rem,2.5vw,.9rem) Georgia,serif}.message{font:italic 1.5rem 'IM Fell English',Georgia,serif;margin:32px 0 0;text-shadow:0 0 16px #eac777}.button{font:700 1rem 'Cinzel',Georgia,serif;color:#f8e6ba;border:1px solid #c8a467;background:#4b2a32;border-radius:5px;padding:14px 20px;margin:25px 0;cursor:pointer}.button:hover{background:#69404a}.footer{margin-top:auto;padding-top:80px;font:italic 1.2rem Georgia,serif;color:#dfc895}.trees{position:absolute;bottom:0;left:0;right:0;pointer-events:none;opacity:.4;font-size:2rem}.sun,.mountain{display:none}@media(max-width:380px){.scene{padding-inline:10px}.timer{gap:5px}.unit{padding:12px 2px}.ribbon{font-size:1.15rem}}
</style></head><body><main class="scene"><div class="moon"></div><div class="castle"></div><div class="crown">⚡</div><div class="eyebrow">Die magische Reise beginnt bald</div><h1>JGA</h1><div class="ribbon">✦ Harzerzauberroller ✦</div><div class="date">23.07. – 25.07.2027</div><p class="sub">Noch bis zu unserem zauberhaften Abenteuer:</p><div class="timer" role="timer" aria-label="Verbleibende Zeit"><div class="unit"><span class="number" id="days">–</span><small>Tage</small></div><div class="unit"><span class="number" id="hours">–</span><small>Stunden</small></div><div class="unit"><span class="number" id="minutes">–</span><small>Minuten</small></div><div class="unit"><span class="number" id="seconds">–</span><small>Sekunden</small></div></div><div class="message" id="message">✧ Der Zauber rückt näher … ✧</div><button class="button" id="share">💌 Countdown teilen</button><div class="footer">✦ Drei Tage voller Magie, Freundschaft und Abenteuer ✦</div><div class="trees" aria-hidden="true">✦ ✧ ✦</div></main><script>
// Start: 23. Juli 2027, 00:00 Uhr in Deutschland (MESZ, UTC+02:00).
const start=new Date('2027-07-23T00:00:00+02:00').getTime();
const end=new Date('2027-07-26T00:00:00+02:00').getTime();
const ids=['days','hours','minutes','seconds'];
function update(){const now=Date.now();let delta=Math.max(0,start-now);const values=[Math.floor(delta/86400000),Math.floor(delta/3600000)%24,Math.floor(delta/60000)%60,Math.floor(delta/1000)%60];values.forEach((n,i)=>document.getElementById(ids[i]).textContent=String(n).padStart(2,'0'));if(now>=start){document.getElementById('message').textContent=now<end?'🎉 Es ist so weit! JGA-Zeit! 🥂':'💖 Was für ein Wochenende!';document.querySelector('.sub').textContent=now<end?'Unser Abenteuer läuft!':'Unser Abenteuer bleibt unvergesslich!';}}
update();setInterval(update,1000);
document.getElementById('share').addEventListener('click',async()=>{const data={title:'JGA – Harzerzauberroller',text:'🥂 JGA – Harzerzauberroller | 23.07.–25.07.2027 🌲'};if(location.protocol.startsWith('http'))data.url=location.href;if(navigator.share){try{await navigator.share(data);return}catch(e){if(e.name==='AbortError')return}}const text=data.text+(data.url?' '+data.url:'');if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);alert('Text zum Teilen kopiert!');return}catch(e){}}prompt('Zum Teilen kopieren:',text)});
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
